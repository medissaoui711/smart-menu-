name: طلب ميزة جديدة (Feature Request)
description: اقترح فكرة أو ميزة جديدة للمشروع (Suggest an idea for this project)
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        نحن نقدر اقتراحاتك لتحسين المشروع! (We appreciate your suggestions to improve the project!)
  - type: textarea
    id: problem-description
    attributes:
      label: هل المشكلة متعلقة بصعوبة معينة؟ (Is your feature request related to a problem?)
      description: وصف واضح وصريح للمشكلة. مثال: "أواجه دائماً صعوبة عندما أحاول..." (A clear and concise description of what the problem is. Ex. I'm always frustrated when [...])
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: وصف الميزة المطلوبة (Describe the solution you'd like)
      description: وصف واضح لما تريد أن يحدث. (A clear and concise description of what you want to happen.)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: بدائل مقترحة (Describe alternatives you've considered)
      description: وصف واضح لأي حلول بديلة أو ميزات فكرت بها. (A clear and concise description of any alternative solutions or features you've considered.)
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: سياق إضافي (Additional context)
      description: أضف أي سياق آخر حول طلب الميزة هنا. (Add any other context or screenshots about the feature request here.)
    validations:
      required: false
