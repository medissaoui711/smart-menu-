    <path d="M256,64 C150,64 64,150 64,256 C64,362 150,448 256,448 C362,448 448,362 448,256 C448,150 362,64 256,64 Z M256,400 C176,400 112,336 112,256 C112,176 176,112 256,112 C336,112 400,176 400,256 C400,336 336,400 256,400 Z" opacity="0.9"/>
    
    <!-- Fork -->
