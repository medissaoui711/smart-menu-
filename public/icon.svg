    <!-- Knife -->
    <path d="M320,144 C337,144 352,159 352,176 L352,256 C352,265 345,272 336,272 L320,272 L320,352 C320,361 313,368 304,368 C295,368 288,361 288,352 L288,176 C288,159 303,144 320,144 Z" />
