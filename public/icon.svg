  <!-- Sparkles -->
  <path d="M380,110 L386,128 L404,134 L386,140 L380,158 L374,140 L356,134 L374,128 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M120,370 L124,382 L136,386 L124,390 L120,402 L116,390 L104,386 L116,382 Z" fill="#ffffff" opacity="0.8"/>
